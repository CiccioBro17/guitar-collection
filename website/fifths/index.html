<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle of Fifths Quiz</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 2em auto;
    padding: 0 1em;
    line-height: 1.5;
  }
  h1 { font-size: 1.4em; }
  label { display: block; margin-top: 1.2em; font-weight: bold; }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 0.35em;
    font-size: 1em;
    margin-top: 0.25em;
  }
  button {
    font-size: 1em;
    padding: 0.4em 0.9em;
    margin-top: 1.2em;
    cursor: pointer;
  }
  .result { margin-top: 0.35em; }
  .correct { color: green; }
  .incorrect { color: #b00000; }
  .answer { font-family: monospace; }
  #fifths-image {
    display: block;
    margin: 1.5em auto 0;
    max-width: 50%;
    height: auto;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<h1>Circle of Fifths Quiz</h1>

<p>Selected root note (from Circle of Fifths): <strong id="root"></strong></p>

<form id="quiz" autocomplete="off">
  <label for="scale">1. Enter the notes of the <span class="quiz-root"></span> Major Scale
    (space-separated, can include notes like B#):</label>
  <input type="text" id="scale" name="scale">
  <div class="result" id="scale-result"></div>

  <label for="maj">2. Enter the notes of the <span class="quiz-root"></span> Major Chord
    (space-separated):</label>
  <input type="text" id="maj" name="maj">
  <div class="result" id="maj-result"></div>

  <label for="min">3. Enter the notes of the <span class="quiz-root"></span> Minor Chord
    (space-separated):</label>
  <input type="text" id="min" name="min">
  <div class="result" id="min-result"></div>

  <button type="submit">Check answers</button>
  <button type="button" id="new-question">New question</button>
  <button type="button" id="help-toggle">Show help</button>
</form>

<img id="fifths-image" src="Circle-of-Fifths.jpg" alt="Circle of Fifths"
     style="display:none;">

<script>
var circleOfFifths = [
  { root: "C",  scale: ["C", "D", "E", "F", "G", "A", "B"],
    maj: ["C", "E", "G"],  min: ["C", "Eb", "G"] },
  { root: "G",  scale: ["G", "A", "B", "C", "D", "E", "F#"],
    maj: ["G", "B", "D"],  min: ["G", "Bb", "D"] },
  { root: "D",  scale: ["D", "E", "F#", "G", "A", "B", "C#"],
    maj: ["D", "F#", "A"], min: ["D", "F", "A"] },
  { root: "A",  scale: ["A", "B", "C#", "D", "E", "F#", "G#"],
    maj: ["A", "C#", "E"], min: ["A", "C", "E"] },
  { root: "E",  scale: ["E", "F#", "G#", "A", "B", "C#", "D#"],
    maj: ["E", "G#", "B"], min: ["E", "G", "B"] },
  { root: "B",  scale: ["B", "C#", "D#", "E", "F#", "G#", "A#"],
    maj: ["B", "D#", "F#"], min: ["B", "D", "F#"] },
  { root: "F#", scale: ["F#", "G#", "A#", "B", "C#", "D#", "E#"],
    maj: ["F#", "A#", "C#"], min: ["F#", "A", "C#"] },
  { root: "C#", scale: ["C#", "D#", "E#", "F#", "G#", "A#", "B#"],
    maj: ["C#", "E#", "G#"], min: ["C#", "E", "G#"] },
  { root: "G#", scale: ["G#", "A#", "B#", "C#", "D#", "E#", "F##"],
    maj: ["G#", "B#", "D#"], min: ["G#", "B", "D#"] },
  { root: "Eb", scale: ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
    maj: ["Eb", "G", "Bb"], min: ["Eb", "Gb", "Bb"] },
  { root: "Bb", scale: ["Bb", "C", "D", "Eb", "F", "G", "A"],
    maj: ["Bb", "D", "F"], min: ["Bb", "Db", "F"] },
  { root: "F",  scale: ["F", "G", "A", "Bb", "C", "D", "E"],
    maj: ["F", "A", "C"],  min: ["F", "Ab", "C"] }
];

var current = null;

function checkAnswer(input, correct) {
  var tokens = input.trim().toLowerCase().split(/\s+/);
  // An empty input produces [""], so treat that as no notes at all.
  if (tokens.length === 1 && tokens[0] === "") tokens = [];

  if (tokens.length !== correct.length) return false;
  for (var i = 0; i < correct.length; i++) {
    if (tokens[i] !== correct[i].toLowerCase()) return false;
  }
  return true;
}

function showResult(id, ok, correctNotes) {
  var el = document.getElementById(id);
  if (ok) {
    el.className = "result correct";
    el.textContent = "Correct!";
  } else {
    el.className = "result incorrect";
    el.innerHTML = 'Incorrect. Correct answer: <span class="answer">' +
                   correctNotes.join(" ") + "</span>";
  }
}

function newQuestion() {
  var index = Math.floor(Math.random() * circleOfFifths.length);
  current = circleOfFifths[index];

  document.getElementById("root").textContent = current.root;
  var roots = document.querySelectorAll(".quiz-root");
  for (var i = 0; i < roots.length; i++) roots[i].textContent = current.root;

  document.getElementById("scale").value = "";
  document.getElementById("maj").value = "";
  document.getElementById("min").value = "";

  ["scale-result", "maj-result", "min-result"].forEach(function (id) {
    var el = document.getElementById(id);
    el.textContent = "";
    el.className = "result";
  });

  document.getElementById("scale").focus();
}

document.getElementById("quiz").addEventListener("submit", function (event) {
  event.preventDefault();
  if (!current) return;

  showResult("scale-result",
             checkAnswer(document.getElementById("scale").value, current.scale),
             current.scale);
  showResult("maj-result",
             checkAnswer(document.getElementById("maj").value, current.maj),
             current.maj);
  showResult("min-result",
             checkAnswer(document.getElementById("min").value, current.min),
             current.min);
});

document.getElementById("new-question").addEventListener("click", newQuestion);

document.getElementById("help-toggle").addEventListener("click", function () {
  var img = document.getElementById("fifths-image");
  var hidden = img.style.display === "none";
  img.style.display = hidden ? "block" : "none";
  this.textContent = hidden ? "Hide help" : "Show help";
});

newQuestion();
</script>

</body>
</html>
